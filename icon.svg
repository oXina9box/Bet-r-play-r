<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181d27"/>
      <stop offset="50%" stop-color="#0f1218"/>
      <stop offset="100%" stop-color="#090b0e"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9416" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff7b00" stop-opacity="0.65"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ff7b00" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#ff7b00" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#glow)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Center composition: Isometric Dice + Casino Chip Accent -->
  <g filter="url(#shadow)">
    <!-- Back/Under Poker Chip Rim -->
    <ellipse cx="256" cy="370" rx="140" ry="42" fill="url(#chipGrad)"/>
    <ellipse cx="256" cy="370" rx="140" ry="42" fill="none" stroke="#ff9416" stroke-width="5" stroke-dasharray="24 16"/>
    <ellipse cx="256" cy="370" rx="105" ry="32" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="12 12"/>

    <!-- Left Die (Amber/Orange) -->
    <g transform="translate(196, 230)">
      <!-- Top Face -->
      <polygon points="0,-72 62,-36 0,0 -62,-36" fill="#fb923c"/>
      <!-- Pip on Top -->
      <circle cx="0" cy="-36" r="8" fill="#181d27"/>

      <!-- Left Face -->
      <polygon points="-62,-36 0,0 0,72 -62,36" fill="#ea580c"/>
      <!-- Pips on Left -->
      <circle cx="-32" cy="10" r="7" fill="#fef08a"/>
      <circle cx="-32" cy="26" r="7" fill="#fef08a"/>

      <!-- Right Face -->
      <polygon points="0,0 62,-36 62,36 0,72" fill="#c2410c"/>
      <!-- Pips on Right -->
      <circle cx="20" cy="14" r="7" fill="#fef08a"/>
      <circle cx="31" cy="18" r="7" fill="#fef08a"/>
      <circle cx="42" cy="22" r="7" fill="#fef08a"/>
    </g>

    <!-- Right Die (Cyan/Blue) -->
    <g transform="translate(306, 210)">
      <!-- Top Face -->
      <polygon points="0,-64 56,-32 0,0 -56,-32" fill="#38bdf8"/>
      <!-- Pips on Top -->
      <circle cx="-20" cy="-32" r="6" fill="#0f172a"/>
      <circle cx="20" cy="-32" r="6" fill="#0f172a"/>
      <circle cx="0" cy="-44" r="6" fill="#0f172a"/>
      <circle cx="0" cy="-20" r="6" fill="#0f172a"/>

      <!-- Left Face -->
      <polygon points="-56,-32 0,0 0,64 -56,32" fill="#0284c7"/>
      <!-- Pips on Left -->
      <circle cx="-28" cy="16" r="6" fill="#e0f2fe"/>
      <circle cx="-42" cy="8" r="6" fill="#e0f2fe"/>
      <circle cx="-14" cy="24" r="6" fill="#e0f2fe"/>
      <circle cx="-42" cy="24" r="6" fill="#e0f2fe"/>
      <circle cx="-14" cy="8" r="6" fill="#e0f2fe"/>

      <!-- Right Face -->
      <polygon points="0,0 56,-32 56,32 0,64" fill="#0369a1"/>
      <!-- Pips on Right -->
      <circle cx="18" cy="10" r="6" fill="#e0f2fe"/>
      <circle cx="38" cy="10" r="6" fill="#e0f2fe"/>
      <circle cx="18" cy="22" r="6" fill="#e0f2fe"/>
      <circle cx="38" cy="22" r="6" fill="#e0f2fe"/>
      <circle cx="18" cy="34" r="6" fill="#e0f2fe"/>
      <circle cx="38" cy="34" r="6" fill="#e0f2fe"/>
    </g>
  </g>

  <!-- Typography: BET-R PLAY-R -->
  <g text-anchor="middle" font-family="sans-serif" font-weight="900">
    <text x="256" y="112" font-size="34" letter-spacing="4" fill="#f8fafc">BET<tspan fill="#ff9416">-R</tspan></text>
    <text x="256" y="440" font-size="24" letter-spacing="8" fill="#94a3b8">PLAY<tspan fill="#ff9416">-R</tspan></text>
  </g>
</svg>
